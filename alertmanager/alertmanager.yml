# P07 — AlertManager config (minimal PoC).
# For production: configure Slack/PagerDuty/email receivers.
global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'default'
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: 'default'
    # P07: For PoC, route alerts to a webhook that the core can consume.
    # In production, swap for Slack/PagerDuty/email config.
    webhook_configs:
      - url: 'http://core:8080/webhooks/alertmanager'
        send_resolved: true
